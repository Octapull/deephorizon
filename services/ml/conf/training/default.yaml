# @package _global_
# Training loop hyperparameters

training:
  epochs: 10
  batch_size: 16
  learning_rate: 1.0e-4
  val_ratio: 0.2

  # Optimizer (Adam)
  optimizer:
    name: adam                     # adam | adamw | sgd
    betas: [0.9, 0.999]
    weight_decay: 0.0

  # LR scheduler (ReduceLROnPlateau)
  scheduler:
    name: reduce_on_plateau        # reduce_on_plateau | cosine | none
    factor: 0.5
    patience: 5
    min_lr: 1.0e-6

  # Mixed precision (Faz 1 Adım 3'te kullanılacak)
  amp: false                       # true → torch.amp.autocast + GradScaler
  amp_dtype: bfloat16              # float16 | bfloat16 (L40S BF16 destekliyor)

  # Gradient accumulation (Faz 1 Adım 4'te kullanılacak)
  grad_accum_steps: 1              # 1 = no accumulation, 4 = effective batch ×4

  # Checkpointing
  save_every_epoch: true
  keep_last_n: 3                   # sadece son N epoch checkpoint'ini tut
