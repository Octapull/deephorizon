# @package _global_
# Data loading configuration
# MinIO mode (default) → 10K 512×512 pairs from docs/DATA.md bucket layout
# Local mode → root_dir/clean/*.npy + root_dir/degraded/*.npy

data:
  root_dir: data/training
  use_minio: true
  bucket_name: datasets
  minio_prefix: datasets/training-512/v1

  # DataLoader
  num_workers: 4
  pin_memory: true
  drop_last: true

  # Augmentation (Faz 1 Adım 8 — train set'e flip + 90° rot + random crop)
  augment: true
  crop_size: 256                   # random crop from 512×512 (augment=true ise)
