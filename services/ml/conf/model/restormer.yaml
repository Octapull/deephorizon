# @package _global_
# Restormer model architecture
# Mirrors services/ml/models/restormer/restormer.py defaults
#
# Restormer (Zamir et al., 2022) — 4-level encoder-decoder transformer.
# Channel widths double at each level: 48 → 96 → 192 → 384.
# Attention is channel-wise (transposed), O(C²) cost instead of O(N²).

model:
  name: restormer
  in_channels: 1
  out_channels: 1

  # Base channel count for level 1. Subsequent levels double:
  # 48, 96, 192, 384. Total params ≈ 54M with default settings.
  dim: 48

  # Transformer blocks per level. Deeper levels have more blocks
  # because they process more complex features.
  # Restormer paper default: [4, 6, 6, 8]
  num_blocks:
    - 4
    - 6
    - 6
    - 8

  # Attention heads per level. Scales with channel count:
  # level 1 (48ch) → 1 head, level 4 (384ch) → 8 heads.
  num_heads:
    - 1
    - 2
    - 4
    - 8

  # GDFN expansion ratio. 2.66 is the Restormer paper default —
  # provides enough capacity for gating without excessive params.
  expansion_factor: 2.66

  # Patch-based training (Restormer paper recommendation).
  # 512×512 images are cropped to patch_size×patch_size patches
  # during training to fit in GPU memory. At inference, the full
  # image is processed (or tiled if needed).
  patch_size: 128
  patch_overlap: 32                # overlap for sliding-window inference
