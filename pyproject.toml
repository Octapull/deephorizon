[project]
name = "deephorizon"
version = "0.0.1"
description = "Deep learning super-resolution and denoising for black hole images from radio telescope arrays"
readme = "README.md"
requires-python = ">=3.12,<3.13"  # Intel Mac (x86_64) needs Python 3.12 — torch 2.2.2 is the last wheel with macosx_10_9_x86_64 + cp312. 3.14 turns ehtim's SyntaxWarnings into SyntaxError — revisit upstream first.
authors = [{ name = "Octapull Interns" }]

# Verified on 2026-05-25: `uv sync --extra data --extra ml --extra dev`
# on Python 3.13.13 resolves to numpy 2.4 + torch 2.12 + ehtim 1.2.10
# in a single venv. See README "Known caveats" for ehtim quirks.
#
# Intel Mac (x86_64) override: Python 3.12 + torch 2.2.2 (last wheel with
# macosx_10_9_x86_64 support). Newer torch versions dropped Intel Mac.

[project.optional-dependencies]
data = [
  "ehtim>=1.2.10",
  "astropy>=7.0.0",
  "dvc>=3.59.0",
  "great-expectations>=1.4.0",
  "boto3==1.34.0",
  "python-dotenv==1.0.1",
  # ehtim imports pkg_resources, which setuptools may drop in 82+.
  # Hold the line until ehtim upstream migrates to importlib.resources.
  "setuptools<82",
]
ml = [
  "torch>=2.2.2,<2.7",  # Intel Mac (x86_64) needs <2.7 — torch 2.7+ dropped macosx_10_9_x86_64 wheels
  "torchvision>=0.17.0,<0.18",  # Intel Mac: last wheel with macosx_10_9_x86_64 is 0.17.2
  "torchmetrics>=1.6.0,<1.7",  # Pin to 1.6.x — 1.7+ requires torch>=2.6 which has no Intel Mac wheel
  "numpy<2.0",  # torch 2.2.2 is incompatible with NumPy 2.x (uses removed _ARRAY_API)
  "lpips>=0.1.4",
  "mlflow>=2.21.0",
  "optuna>=4.3.0",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
]
serving = [
  "torch>=2.2.2,<2.7",  # Intel Mac (x86_64) needs <2.7
  "onnxruntime-gpu>=1.20.0",
  "grpcio>=1.70.0",
  "grpcio-tools>=1.70.0",
  "protobuf>=5.29.0",
  "prometheus-client>=0.22.0",
  "evidently>=0.6.0",
]
dev = [
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["services", "scripts"]
addopts = "-q --cov --cov-report=term-missing --cov-fail-under=80"
